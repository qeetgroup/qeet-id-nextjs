name: Link the Qeet ID packages
description: >-
  Until @qeet-id/node and @qeet-id/react are on npm, builds them from their
  repositories and registers them with `bun link`, which package.json's
  "resolutions" point at. Once both are published, delete this action, its
  steps in the workflows and the "resolutions", and run `bun install`.

inputs:
  node-ref:
    description: The qeet-id-node branch, tag or commit to build
    default: develop
  react-ref:
    description: The qeet-id-react branch, tag or commit to build
    default: develop

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: qeetgroup/qeet-id-node
        ref: ${{ inputs.node-ref }}
        path: .deps/qeet-id-node
        persist-credentials: false

    - uses: actions/checkout@v7
      with:
        repository: qeetgroup/qeet-id-react
        ref: ${{ inputs.react-ref }}
        path: .deps/qeet-id-react
        persist-credentials: false

    - name: Build and link them
      shell: bash
      run: |
        for package in qeet-id-node qeet-id-react; do
          (cd ".deps/$package" && bun install --frozen-lockfile && bun run build && bun link)
        done
